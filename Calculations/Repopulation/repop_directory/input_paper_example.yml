cosmo_constants:
  G:
    value: !!float 4.297e-06
    unit: kpc * km2 / (M_sun * s2)
  H_0:
    value: 67.7
    unit: km / (s * Mpc)
  rho_crit:
    value: 135.73
    unit: M_sun / kpc3

host:
  R_vir:
    value: 220
    unit: kpc
  r_s:
    value: 20.0
    unit: kpc
  rho_0:
    value: !!float 9.04e6
    unit: M_sun / kpc3
  position_Earth:
    value: [8.5, 0., 0.]
    unit: kpc

repopulations:
  RangeMax: 120.0
  RangeMin: 50.

  use_Roche: True

  its: 5
  save_all: True
  num_brightest: 1
  print_freq: 1

  num_subs_max: !!float 5e5
  rng_seed: 0

  columns_to_save:
    formula_example:
      formula: '1e17 * params[0] * Vmax'
      params:
        - 0.5
        - !!float 2e7
      variables:
        'Vmax'
      unit: M_sun * km / s
    R_t:
    R_s:
    J03_vel:
    Js_vel:
    theta_s:

configurations:
  dmo_resilient:
    Cv:
      formula: 'Moline21_normalization'
      params:
        c0: 283862.7023
        sigma_scatter: 0.297659
    SHVF:
      formula: 'power_law'
      params:
        V0: 5.78
        slope: -3.92
    SRD:
      formula: 'srd_constant'
      params:
        args: 1.

  dmo_fragile:
    Cv:
      formula: 'Moline21_normalization'
      params:
        c0: 283862.7023
        sigma_scatter: 0.297659
    SHVF:
      formula: 'power_law'
      params:
        V0: 5.68
        slope: -3.92
    SRD:
      formula: 'srd_exponential'
      params:
        exp_fit:
          - -0.151
          - 39.3
          - 220.0
        last_subhalo:
          value: 5.57
          unit: kpc

  mhd_resilient:
    Cv:
      formula: 'Moline21_normalization'
      params:
        c0: 192879.057
        sigma_scatter: 0.374942
    SHVF:
      formula: 'power_law'
      params:
        V0: 5.51
        slope: -4.08
    SRD:
      formula: 'srd_constant'
      params:
        args: 1.

  mhd_fragile:
    Cv:
      formula: 'Moline21_normalization'
      params:
        c0: 192879.057
        sigma_scatter: 0.374942
    SHVF:
      formula: 'power_law'
      params:
        V0: 5.3
        slope: -4.08
    SRD:
      formula: 'srd_exponential'
      params:
        exp_fit:
          - -0.16
          - 37.1
          - 220.0
        last_subhalo:
          value: 15.71
          unit: kpc

units:
  Vmax: km / s
  Distgc: kpc
