cosmo_constants:
  G:
    value: !!float 4.297e-06
    unit: kpc * km2 / (Msun * s2)
  H_0:
    value: 67.7
    unit: km / (s * Mpc)
  rho_crit:
    value: 135.73
    unit: Msun / kpc3

host:
  density_profile: 'NFW'
  R_vir:
    value: 220
    unit: kpc
  r_s:
    value: 20.0
    unit: kpc
  rho_0:
    value: !!float 9.04e6
    unit: Msun / kpc3
  position_Earth:
    value: [8.5, 0., 0.]
    unit: kpc

repopulations:
  RangeMax: 120.
  RangeMin: 35.

  number_iterations: 2
  print_frequency: 1

  save_full_repop: False
  use_spherical_shells: False
  number_highest: 5000
  allow_break_Roche: True
  allow_engulf_Earth: True
  params_to_order_by:
    - Vmax
    - D_GC

  rng_seed: 0

  params_to_save:
    Vmax:
      unit: km / s
    D_GC:
      unit: kpc
#    formula_example:
#      formula: '1e17 * params[0] * Vmax'
#      params:
#        - 0.5
#        - !!float 2e7
#      variables:
#        'Vmax'
#      unit: Msun * km / s
#    R_t:
#      unit: kpc
#    R_s:
#      unit: kpc
#    Rmax:
#      unit: kpc
#    J03_fromVmax:
#      unit: Msun2 / cm5
    Js_fromVmax:
      unit: GeV2 / cm5
    J_whole_fromVmax:
      unit: GeV2 / cm5
    J_general:
      unit: GeV2 / cm5
      calculate_from: Vmax_Rmax
#    theta_s:
#      unit: degree

configurations:
  dmo_ale:
    internal_density_profile: 'NFW'
    use_Roche: True
    Cv:
      formula: 'Cv_Mol2021_redshift0_scattered'
      params:
        c0: 283862.7023
        sigma_scatter: 0.297659
    SHVF:
      formula: 'power_law'
      params:
        V0: 5.8963127240825415
        slope: -3.97
    SRD:
      formula: 'srd_exponential'
      params:
        exp_fit:
          - -0.151
          - 39.3
          - 220.0
        last_subhalo:
          value: 5.57
          unit: kpc
  dmo_resilient:
    internal_density_profile: 'NFW'
    use_Roche: True
    Cv:
      formula: 'Cv_Mol2021_redshift0_scattered'
      variables: Vmax
      params:
        c0: 283862.7023
        sigma_scatter: 0.297659
    SHVF:
      formula: 'power_law'
      params:
        V0: 5.78
        slope: -3.92
    SRD:
      formula: 'srd_constant'
      params:
        args: 1.

#  TODO: Cv fails with '3e5 + Vmax.value'

  dmo_fragile:
    internal_density_profile:  'NFW'
#      formula: '1. / xx / (1. + xx)**params'
#      formula: '1. / (1. + xx**params[1]) / (1. + xx**params[0])'
#      params: [2., 3.]
    use_Roche: True
    Cv:
      formula: 'Cv_Mol2021_redshift0_scattered'
      params:
        c0: 283862.7023
        sigma_scatter: 0.297659
    SHVF:
      formula: 'power_law'
      params:
        V0: 5.68
        slope: -3.92
    SRD:
      formula: 'srd_exponential'
      params:
        exp_fit:
          - -0.151
          - 39.3
          - 220.0
        last_subhalo:
          value: 15.57
          unit: kpc

  mhd_resilient:
    internal_density_profile: 'NFW'
    use_Roche: True
    Cv:
      formula: 'Cv_Mol2021_redshift0_scattered'
      params:
        c0: 192879.057
        sigma_scatter: 0.374942
    SHVF:
      formula: 'power_law'
      params:
        V0: 5.51
        slope: -4.08
    SRD:
      formula: 'srd_constant'
      params:
        args: 1.

